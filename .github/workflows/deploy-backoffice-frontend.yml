name: Deploy Backoffice Frontend

on:
  push:
    branches: [master, staging]
    paths:
      - 'apps/backoffice-frontend/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: '@backoffice/frontend'
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: backoffice-frontend
      image-name: backoffice-frontend
      cloud-run-services: '[{"service": "msgops-backoffice-web", "port": 3000}]'
      docker-context: '.'
      dockerfile: apps/backoffice-frontend/Dockerfile
      docker-build-args: |
        NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL_STAGING }}
      environment: staging
      gcp-project: ${{ vars.GCP_PROJECT_STAGING }}
      registry: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_STAGING }}/${{ vars.ARTIFACT_REPO }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: backoffice-frontend
      image-name: backoffice-frontend
      cloud-run-services: '[{"service": "msgops-backoffice-web", "port": 3000}]'
      docker-context: '.'
      dockerfile: apps/backoffice-frontend/Dockerfile
      docker-build-args: |
        NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
      environment: production
      gcp-project: ${{ vars.GCP_PROJECT_PRODUCTION }}
      registry: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_PRODUCTION }}/${{ vars.ARTIFACT_REPO }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
