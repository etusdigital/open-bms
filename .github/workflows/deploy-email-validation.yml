name: Deploy email-validation

on:
  push:
    branches: [master, staging]
    paths: ['apps/email-validation/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: email-checker
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: email-validation
      image-name: email-validation
      docker-context: '.'
      dockerfile: apps/email-validation/Dockerfile
      cloud-run-services: '[{"service": "msgops-email-validation", "port": 8080}]'
      environment: staging
      registry: us-east1-docker.pkg.dev/etus-media-development-staging/msgops
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: email-validation
      image-name: email-validation
      docker-context: '.'
      dockerfile: apps/email-validation/Dockerfile
      cloud-run-services: '[{"service": "msgops-email-validation", "port": 8080}]'
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
