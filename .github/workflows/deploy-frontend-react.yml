name: Deploy frontend-react

on:
  push:
    branches: [master, staging]
    paths:
      - 'apps/frontend-react/**'
      - 'packages/shared/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/frontend-react/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: '@msgops/frontend-react'
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudflare-pages.yml
    with:
      app-name: frontend-react
      project-name: bms-frontend-react
      branch: staging
      turbo-filter: '@msgops/frontend-react'
      environment: staging
    secrets:
      CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN_STAGING }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID_STAGING }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
      VITE_REDIRECT_MANAGER_URL: ${{ secrets.VITE_REDIRECT_MANAGER_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_API_URL: ${{ secrets.TURBO_API_URL }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudflare-pages.yml
    with:
      app-name: frontend-react
      project-name: bms-frontend-react
      turbo-filter: '@msgops/frontend-react'
      environment: production
    secrets:
      CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_REDIRECT_MANAGER_URL: ${{ secrets.VITE_REDIRECT_MANAGER_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_API_URL: ${{ secrets.TURBO_API_URL }}

  register-preview-url:
    name: Register preview URL in Auth0
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.compute.outputs.preview-url }}
    steps:
      - name: Compute preview URL
        id: compute
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "preview-url=https://pr-${PR_NUMBER}.bms-frontend-react.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Add URL to Auth0 allowed lists (staging tenant)
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID_STAGING }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET_STAGING }}
          AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID_STAGING }}
          PREVIEW_URL: ${{ steps.compute.outputs.preview-url }}
        run: |
          set -e
          RESPONSE=$(curl -s --request POST \
            --url "https://${AUTH0_DOMAIN}/oauth/token" \
            --header 'content-type: application/json' \
            --data "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to obtain Auth0 management token"
            echo "Auth0 response:"
            echo "$RESPONSE" | jq '. | {error, error_description}' 2>/dev/null || echo "$RESPONSE"
            exit 1
          fi

          CLIENT=$(curl -s \
            --header "Authorization: Bearer $TOKEN" \
            "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_SPA_CLIENT_ID}")

          CALLBACK="${PREVIEW_URL}/callback"
          LOGOUT="${PREVIEW_URL}"
          ORIGIN="${PREVIEW_URL}"

          UPDATED=$(echo "$CLIENT" | jq \
            --arg cb "$CALLBACK" \
            --arg lo "$LOGOUT" \
            --arg og "$ORIGIN" \
            '{
              callbacks: (.callbacks + [$cb] | unique),
              allowed_logout_urls: (.allowed_logout_urls + [$lo] | unique),
              web_origins: (.web_origins + [$og] | unique)
            }')

          curl -s --request PATCH \
            --header "Authorization: Bearer $TOKEN" \
            --header "content-type: application/json" \
            --data "$UPDATED" \
            "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_SPA_CLIENT_ID}" \
            > /dev/null

          echo "Registered $PREVIEW_URL in Auth0"

  deploy-preview:
    needs: register-preview-url
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/_deploy-cloudflare-pages.yml
    with:
      app-name: frontend-react
      project-name: bms-frontend-react
      branch: pr-${{ github.event.pull_request.number }}
      turbo-filter: '@msgops/frontend-react'
      environment: staging
      alias-url: ${{ needs.register-preview-url.outputs.preview-url }}
    secrets:
      CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN_STAGING }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID_STAGING }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
      VITE_REDIRECT_MANAGER_URL: ${{ secrets.VITE_REDIRECT_MANAGER_URL }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_API_URL: ${{ secrets.TURBO_API_URL }}

  cleanup-preview:
    name: Cleanup preview on PR close
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove URL from Auth0 allowed lists (staging tenant)
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID_STAGING }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET_STAGING }}
          AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID_STAGING }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          PREVIEW_URL="https://pr-${PR_NUMBER}.bms-frontend-react.pages.dev"

          TOKEN=$(curl -s --request POST \
            --url "https://${AUTH0_DOMAIN}/oauth/token" \
            --header 'content-type: application/json' \
            --data "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}" \
            | jq -r '.access_token')

          CLIENT=$(curl -s \
            --header "Authorization: Bearer $TOKEN" \
            "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_SPA_CLIENT_ID}")

          UPDATED=$(echo "$CLIENT" | jq \
            --arg cb "${PREVIEW_URL}/callback" \
            --arg lo "$PREVIEW_URL" \
            --arg og "$PREVIEW_URL" \
            '{
              callbacks: (.callbacks - [$cb]),
              allowed_logout_urls: (.allowed_logout_urls - [$lo]),
              web_origins: (.web_origins - [$og])
            }')

          curl -s --request PATCH \
            --header "Authorization: Bearer $TOKEN" \
            --header "content-type: application/json" \
            --data "$UPDATED" \
            "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_SPA_CLIENT_ID}" \
            > /dev/null

          echo "Removed $PREVIEW_URL from Auth0"

      - name: Delete Cloudflare Pages preview deployment
        env:
          CF_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          BRANCH="pr-${PR_NUMBER}"
          # List deployments for this branch and delete them
          DEPLOYMENTS=$(curl -s \
            --header "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/bms-frontend-react/deployments?env=preview" \
            | jq -r --arg branch "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          for id in $DEPLOYMENTS; do
            curl -s --request DELETE \
              --header "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/bms-frontend-react/deployments/${id}?force=true" \
              > /dev/null
            echo "Deleted deployment $id"
          done
