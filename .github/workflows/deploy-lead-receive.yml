name: Deploy lead-receive

on:
  push:
    branches: [master, staging]
    paths: ['apps/lead-receive/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: lead-receive
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: lead-receive
      image-name: lead-receive
      docker-context: '.'
      dockerfile: apps/lead-receive/Dockerfile
      cloud-run-services: '[{"service": "msgops-lead-receive", "port": 8080}]'
      environment: staging
      registry: us-east1-docker.pkg.dev/etus-media-development-staging/msgops
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: lead-receive
      image-name: lead-receive
      docker-context: '.'
      dockerfile: apps/lead-receive/Dockerfile
      cloud-run-services: '[{"service": "msgops-lead-receive", "port": 8080}]'
      gcp-project: ${{ vars.GCP_PROJECT_LEAD_ENTRY }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
