name: Deploy msgops-api

on:
  push:
    branches: [master, staging]
    paths: ['apps/msgops-api/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: msgops-api
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: msgops-api
      image-name: msgops-api
      docker-context: '.'
      dockerfile: apps/msgops-api/Dockerfile
      cloud-run-services: '[{"service": "msgops-api-stg", "port": 5000}]'
      environment: staging
      registry: us-east1-docker.pkg.dev/etus-media-development-staging/msgops
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: msgops-api
      image-name: msgops-api
      docker-context: '.'
      dockerfile: apps/msgops-api/Dockerfile
      cloud-run-services: '[{"service": "msgops-api-prd", "port": 5000}]'
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
