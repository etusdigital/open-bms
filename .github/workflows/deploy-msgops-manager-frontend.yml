name: Deploy msgops-manager-frontend

on:
  push:
    branches: [master, staging]
    paths: ['apps/msgops-manager-frontend/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: msgops-manager-frontend
    secrets: inherit

  lint-and-build:
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/msgops-manager-frontend
        run: pnpm lint

      - name: Build (staging)
        if: github.ref_name == 'staging'
        working-directory: apps/msgops-manager-frontend
        env:
          VITE_API_MSGOPS: ${{ vars.MSGOPS_API_URL_STAGING }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID_STAGING }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE_STAGING }}
          VITE_AUTH0_CALLBACK_URL: ${{ vars.AUTH0_CALLBACK_URL_STAGING }}
          VITE_APP_REDIRECT_MSGOPS: ${{ vars.MSGOPS_REDIRECT_URL_STAGING }}
          VITE_AUTH0_ROLES_CLAIM: ${{ vars.AUTH0_ROLES_CLAIM }}
          VITE_AUTH0_BILLING_ONLY_ROLE: ${{ vars.AUTH0_BILLING_ONLY_ROLE }}
        run: pnpm build

      - name: Build (production)
        if: github.ref_name != 'staging'
        working-directory: apps/msgops-manager-frontend
        env:
          VITE_API_MSGOPS: ${{ vars.MSGOPS_API_URL_PRODUCTION }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID_PRODUCTION }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE_PRODUCTION }}
          VITE_AUTH0_CALLBACK_URL: ${{ vars.AUTH0_CALLBACK_URL_PRODUCTION }}
          VITE_APP_REDIRECT_MSGOPS: ${{ vars.MSGOPS_REDIRECT_URL_PRODUCTION }}
          VITE_AUTH0_ROLES_CLAIM: ${{ vars.AUTH0_ROLES_CLAIM }}
          VITE_AUTH0_BILLING_ONLY_ROLE: ${{ vars.AUTH0_BILLING_ONLY_ROLE }}
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: apps/msgops-manager-frontend/dist/

  deploy-staging:
    needs: lint-and-build
    if: |
      always() &&
      github.ref_name == 'staging' &&
      needs.lint-and-build.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-staging
          path: dist/

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCS (staging)
        run: |
          gsutil -h "Cache-Control:no-cache,no-store,max-age=0" -m rsync -dr dist/ ${{ vars.GCS_BUCKET_STAGING }}

  deploy-production:
    needs: lint-and-build
    if: |
      always() &&
      github.ref_name != 'staging' &&
      needs.lint-and-build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-master
          path: dist/

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCS (production)
        run: |
          gsutil -h "Cache-Control:no-cache,no-store,max-age=0" -m rsync -dr dist/ ${{ vars.GCS_BUCKET_PRODUCTION }}
