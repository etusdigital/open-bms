name: Deploy send-email

on:
  push:
    branches: [master, staging]
    paths: ['apps/send-email/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: msgops-service-send-email
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: send-email
      image-name: send-email
      docker-context: '.'
      dockerfile: apps/send-email/Dockerfile
      cloud-run-services: |
        [
          {"service": "msgops-send-email", "port": 8080},
          {"service": "msgops-send-email-low", "port": 8080},
          {"service": "msgops-send-email-high", "port": 8080},
          {"service": "msgops-send-email-transactional", "port": 8080},
          {"service": "msgops-send-email-campaigns", "port": 8080}
        ]
      environment: staging
      gcp-project: ${{ vars.GCP_PROJECT_STAGING }}
      registry: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_STAGING }}/${{ vars.ARTIFACT_REPO }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: send-email
      image-name: send-email
      docker-context: '.'
      dockerfile: apps/send-email/Dockerfile
      cloud-run-services: |
        [
          {"service": "msgops-send-email", "port": 8080},
          {"service": "msgops-send-email-low", "port": 8080},
          {"service": "msgops-send-email-high", "port": 8080},
          {"service": "msgops-send-email-transactional", "port": 8080},
          {"service": "msgops-send-email-campaign", "port": 8080}
        ]
      gcp-project: ${{ vars.GCP_PROJECT_PRODUCTION }}
      registry: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_PRODUCTION }}/${{ vars.ARTIFACT_REPO }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
