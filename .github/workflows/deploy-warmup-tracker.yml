name: Deploy warmup-tracker

on:
  push:
    branches: [master, staging]
    paths: ['apps/warmup-tracker/**']
  workflow_dispatch:
    inputs:
      force:
        description: Force deploy (skip change detection)
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      package-name: msgops-warmup-tracker
    secrets: inherit

  deploy-staging:
    needs: changes
    if: |
      always() &&
      github.ref_name == 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: warmup-tracker
      image-name: warmup-tracker
      docker-context: '.'
      dockerfile: apps/warmup-tracker/Dockerfile
      cloud-run-services: '[{"service": "msgops-warmup-tracker", "port": 8080}]'
      environment: staging
      registry: us-east1-docker.pkg.dev/etus-media-development-staging/msgops
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_STAGING }}

  deploy-production:
    needs: changes
    if: |
      always() &&
      github.ref_name != 'staging' &&
      (needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      app-name: warmup-tracker
      image-name: warmup-tracker
      docker-context: '.'
      dockerfile: apps/warmup-tracker/Dockerfile
      cloud-run-services: '[{"service": "msgops-warmup-tracker", "port": 8080}]'
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
