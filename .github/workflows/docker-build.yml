name: Docker Build & Push

# Publishes one image per app/ Dockerfile to Docker Hub under etusdigital/bms-*.
#
# - push to main → `:latest` + `:main-<sha7>`
# - tag v*.*.*    → `:<version>` + `:latest` (matches the evo-crm-community
#                    convention — git tag carries `v`, docker tag does not)
#
# Matrix is the source of truth for which apps get an image. Probe/mock apps
# (event-receiver-probe, sendgrid-mock) and the legacy frontend-vue2 are
# intentionally excluded.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override tag (default: derived from ref)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  REGISTRY_ORG: etusdigital

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - msgops-api
          - frontend-react
          - event-receiver
          - event-process
          - send-email
          - send-push
          - send-whatsapp
          - twilio-messaging
          - campaign-events-tracker
          - campaign-packer
          - tracker
          - tag-process
          - message-trigger
          - geolocation
          - enterprise-import

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/bms-${{ matrix.app }}"
          SHA7="${GITHUB_SHA::7}"
          TAGS=""

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Release tag: strip leading v from git tag for the docker tag.
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$IMAGE:$VERSION,$IMAGE:latest"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # main branch: always update :latest plus a sha-stamped tag for
            # deterministic rollbacks.
            TAGS="$IMAGE:latest,$IMAGE:main-$SHA7"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # workflow_dispatch override.
            TAGS="$IMAGE:${{ github.event.inputs.tag }}"
          else
            echo "Unsupported ref: $GITHUB_REF" >&2
            exit 1
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          # GitHub Actions cache keeps the matrix runs hot across pushes.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Vite needs VITE_API_URL baked in at build time. /api is the safe
          # default — the production stack file documents how to override.
          build-args: |
            VITE_API_URL=/api
