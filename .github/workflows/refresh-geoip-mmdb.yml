name: Refresh GeoIP MMDB

on:
  schedule:
    # 06:00 UTC daily. Idempotent per-month via archive/ guard.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force upload even if archive/ already has this month'
        type: boolean
        default: false
      skip_production:
        description: 'Run against staging only (leave unchecked for full run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Download + verify MMDB from DB-IP. Runs once; artifact feeds both envs.
  # --------------------------------------------------------------------------
  download:
    name: Download + verify
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.info.outputs.filename }}
      archive_name: ${{ steps.info.outputs.archive_name }}
      month: ${{ steps.info.outputs.month }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install root deps (mmdb-reader, tsx)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Query DB-IP API
        id: info
        env:
          ACCOUNT_KEY: ${{ secrets.DBIP_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          RESP=$(curl -sSfL "https://db-ip.com/account/${ACCOUNT_KEY}/db/ip-to-full-v4/mmdb")
          FILENAME=$(echo "$RESP" | jq -r '.name')
          URL=$(echo "$RESP" | jq -r '.url')
          MD5=$(echo "$RESP" | jq -r '.md5sum // empty')
          SHA1=$(echo "$RESP" | jq -r '.sha1sum // empty')
          DATE=$(echo "$RESP" | jq -r '.date')

          if [ -z "$FILENAME" ] || [ -z "$URL" ]; then
            echo "::error::DB-IP API did not return name+url"; exit 1
          fi
          if [ -z "$MD5" ] && [ -z "$SHA1" ]; then
            echo "::error::DB-IP API returned no checksum"; exit 1
          fi

          ARCHIVE_NAME="${FILENAME%.gz}"
          MONTH="${DATE:0:7}"

          {
            echo "filename=$FILENAME"
            echo "archive_name=$ARCHIVE_NAME"
            echo "month=$MONTH"
          } >> "$GITHUB_OUTPUT"

          # Pre-signed URL embeds auth — mask to keep it out of logs.
          echo "::add-mask::$URL"
          {
            echo "URL=$URL"
            echo "MD5=$MD5"
            echo "SHA1=$SHA1"
          } >> "$GITHUB_ENV"

          echo "Resolved $FILENAME ($MONTH)"

      - name: Download gzipped MMDB
        run: curl -sSfL --retry 3 --retry-delay 10 -o dbip.mmdb.gz "$URL"

      - name: Verify MD5
        if: env.MD5 != ''
        run: |
          ACTUAL=$(md5sum dbip.mmdb.gz | cut -d' ' -f1)
          if [ "$ACTUAL" != "$MD5" ]; then
            echo "::error::MD5 mismatch: $ACTUAL != $MD5"; exit 1
          fi

      - name: Verify SHA1
        if: env.SHA1 != ''
        run: |
          ACTUAL=$(sha1sum dbip.mmdb.gz | cut -d' ' -f1)
          if [ "$ACTUAL" != "$SHA1" ]; then
            echo "::error::SHA1 mismatch: $ACTUAL != $SHA1"; exit 1
          fi

      - name: Gunzip
        run: gunzip dbip.mmdb.gz

      - name: Validate MMDB fixtures
        run: pnpm tsx scripts/validate-mmdb.ts dbip.mmdb scripts/mmdb-fixtures.json

      - name: Upload artifact for upload job
        uses: actions/upload-artifact@v4
        with:
          name: dbip-mmdb
          path: dbip.mmdb
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Upload to GCS + trigger Cloud Run rollout, per-env matrix.
  # --------------------------------------------------------------------------
  upload:
    name: Upload + rollout (${{ matrix.target.env }})
    needs: download
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - env: staging
            project: etus-media-development-staging
            bucket: geoip-stg
            sa_key_secret: GCP_SA_KEY_STAGING
          - env: production
            project: etus-media-prod
            bucket: geoip-mmdb
            sa_key_secret: GCP_SA_KEY
    steps:
      - name: Skip production if requested
        id: env_gate
        env:
          ENV: ${{ matrix.target.env }}
          SKIP_PROD: ${{ inputs.skip_production }}
        run: |
          if [ "$ENV" = "production" ] && [ "$SKIP_PROD" = "true" ]; then
            echo "::notice::Skipping production (skip_production input)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download MMDB artifact
        if: steps.env_gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dbip-mmdb

      - name: Authenticate to GCP
        if: steps.env_gate.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[matrix.target.sa_key_secret] }}

      - name: Setup gcloud
        if: steps.env_gate.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Skip if already refreshed this month
        if: steps.env_gate.outputs.skip != 'true'
        id: guard
        env:
          BUCKET: ${{ matrix.target.bucket }}
          ARCHIVE_NAME: ${{ needs.download.outputs.archive_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gsutil -q stat "gs://${BUCKET}/archive/${ARCHIVE_NAME}"; then
            echo "::notice::Already refreshed: gs://${BUCKET}/archive/${ARCHIVE_NAME}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload (tmp -> archive -> canonical)
        if: steps.env_gate.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          BUCKET: ${{ matrix.target.bucket }}
          ARCHIVE_NAME: ${{ needs.download.outputs.archive_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE="${ARCHIVE_NAME%.mmdb}"
          TMP="gs://${BUCKET}/tmp/${BASE}-${RUN_ID}.mmdb"
          ARCHIVE="gs://${BUCKET}/archive/${ARCHIVE_NAME}"
          CANON="gs://${BUCKET}/dbip-full.mmdb"
          gsutil -h "Content-Type:application/octet-stream" cp dbip.mmdb "$TMP"
          gsutil cp "$TMP" "$ARCHIVE"
          gsutil cp "$TMP" "$CANON"
          gsutil rm "$TMP"

      - name: Trigger Cloud Run revision rollout
        if: steps.env_gate.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          PROJECT: ${{ matrix.target.project }}
          MONTH: ${{ needs.download.outputs.month }}
        run: |
          gcloud run services update msgops-geolocation \
            --region=us-east1 \
            --project="$PROJECT" \
            --update-env-vars="DBIP_MMDB_REFRESHED_AT=${MONTH}"

  # --------------------------------------------------------------------------
  # Slack alert on any upstream failure.
  # --------------------------------------------------------------------------
  notify:
    name: Notify on failure
    needs: [download, upload]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_REFRESH_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONTH: ${{ needs.download.outputs.month || 'unknown' }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_REFRESH_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          # Build JSON via jq so special chars in MONTH / RUN_URL cannot break the payload.
          BODY=$(jq -n \
            --arg month "$MONTH" \
            --arg url "$RUN_URL" \
            '{text: (":rotating_light: GeoIP MMDB refresh failed for " + $month + ". Run: " + $url)}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK"
