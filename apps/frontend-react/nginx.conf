server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy: /api/* → msgops-api (strips /api prefix)
    location /api/ {
        # Same-origin GET requests from the SPA don't include Origin, but
        # msgops-api CORS rejects origin-less requests in production.
        # Synthesize Origin from the forwarded proto + host when missing.
        set $proxy_origin $http_origin;
        if ($proxy_origin = '') {
            set $proxy_origin "$http_x_forwarded_proto://$host";
        }
        proxy_set_header Origin $proxy_origin;

        proxy_pass http://msgops-api:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # SPA fallback: every non-asset, non-API path serves index.html.
    # No-store on the shell prevents stale index.html pointing at hashed
    # /assets/* bundles that no longer exist after a deploy.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
