server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Docker Swarm's embedded DNS. Using a variable in proxy_pass forces nginx
    # to resolve the upstream per-request instead of at startup, preventing
    # crash-loops when msgops-api is not yet available during rolling deploys.
    resolver 127.0.0.11 valid=10s;

    # API reverse proxy: /api/* → msgops-api (strips /api prefix)
    location /api/ {
        # Same-origin GET requests from the SPA don't include Origin, but
        # msgops-api CORS rejects origin-less requests in production.
        # Synthesize Origin from $scheme (never empty) + $http_host (includes port).
        set $proxy_origin $http_origin;
        if ($proxy_origin = '') {
            set $proxy_origin "$scheme://$http_host";
        }
        proxy_set_header Origin $proxy_origin;

        set $api_upstream http://msgops-api:5001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # /bms/* is the public BMS surface served by msgops-api (NOT the SPA):
    #   POST /bms/leads            — evo-academy conversion pixel
    #   POST /bms/leads/web-push   — web-push token ingestion
    #   GET  /bms/push/:hash.js    — per-account service worker
    #   GET  /bms/bmstrk.js        — on-page tracker
    #   GET  /bms/web-push.js      — on-page FCM client
    #   POST /bms/events           — tracker events
    # Prefix match so EVERY /bms/* path reaches the API. Without this the paths
    # fall through to `location /` and get index.html (200) — the SPA router then
    # shows "Página não encontrada", and pixel/tracker clients that only check
    # the status code fail silently. No rewrite: msgops-api expects the path
    # verbatim (it mounts these controllers under `bms`).
    location /bms/ {
        set $proxy_origin $http_origin;
        if ($proxy_origin = '') {
            set $proxy_origin "$scheme://$http_host";
        }
        proxy_set_header Origin $proxy_origin;

        set $api_upstream http://msgops-api:5001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: every non-asset, non-API path serves index.html.
    # No-store on the shell prevents stale index.html pointing at hashed
    # /assets/* bundles that no longer exist after a deploy.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
