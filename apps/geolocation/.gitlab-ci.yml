stages:
  - test
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: 1
  DOCKER_DRIVER: overlay2
  # Cache key based on package.json and pnpm-lock.yaml
  CACHE_KEY: ${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}-${CI_COMMIT_BRANCH}

cache:
  key: ${CACHE_KEY}
  paths:
    - node_modules/
    - .pnpm-cache/
  policy: pull-push

test_code:
  stage: test
  image: node:20-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-8 --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - pnpm test:cov
  artifacts:
    name: "%CI_JOB_STAGE%-%CI_COMMIT_REF_NAME%"
    untracked: true
    paths:
      - coverage/
    expire_in: 7 days
  only:
    - merge_requests
    - master
    - staging

build_staging:
  stage: build
  environment:
    name: staging
  image: google/cloud-sdk:slim
  before_script:
    - gcloud auth activate-service-account --key-file $GCP_SERVICE_KEY
    - gcloud config set project $GCP_PROJECT_REPOSITORY
    # Check if package.json or pnpm-lock.yaml has changed
    - |
      if [ -f "pnpm-lock.yaml" ]; then
        PACKAGE_HASH=$(sha256sum package.json pnpm-lock.yaml | sha256sum | cut -d' ' -f1)
      else
        PACKAGE_HASH=$(sha256sum package.json | sha256sum | cut -d' ' -f1)
      fi
      echo "PACKAGE_HASH=${PACKAGE_HASH}" >> build.env
  script:
    - gcloud config set gcloudignore/enabled false
    - gcloud builds submit . --tag $GCP_IMAGE-$CI_COMMIT_REF_SLUG:$VERSION
  only:
    - staging

deploy_staging:
  stage: deploy
  environment:
    name: staging
  image: google/cloud-sdk:slim
  before_script:
    - gcloud auth activate-service-account --key-file $GCP_SERVICE_KEY
    - gcloud config set project $GCP_PROJECT
    - gcloud config set run/region $GCP_REGION
    - gcloud config set run/platform $GCP_RUN_PLATFORM
    - export CLOUDSDK_CORE_DISABLE_PROMPTS=1
  script:
    - gcloud alpha run deploy $GCP_RUN_SERVICE_NAME --image $GCP_IMAGE-$CI_COMMIT_REF_SLUG:$VERSION  --allow-unauthenticated --port=3000
  only:
    - staging

build_production:
  stage: build
  environment:
    name: production
  image: google/cloud-sdk:slim
  before_script:
    - gcloud auth activate-service-account --key-file $GCP_SERVICE_KEY
    - gcloud config set project $GCP_PROJECT_REPOSITORY
    # Check if package.json or pnpm-lock.yaml has changed
    - |
      if [ -f "pnpm-lock.yaml" ]; then
        PACKAGE_HASH=$(sha256sum package.json pnpm-lock.yaml | sha256sum | cut -d' ' -f1)
      else
        PACKAGE_HASH=$(sha256sum package.json | sha256sum | cut -d' ' -f1)
      fi
      echo "PACKAGE_HASH=${PACKAGE_HASH}" >> build.env
  script:
    - gcloud config set gcloudignore/enabled false
    - gcloud builds submit . --tag $GCP_IMAGE-$CI_COMMIT_REF_SLUG:$VERSION
  only:
    - master
  when: manual

deploy_production:
  stage: deploy
  environment:
    name: production
  image: google/cloud-sdk:slim
  before_script:
    - gcloud auth activate-service-account --key-file $GCP_SERVICE_KEY
    - gcloud config set project $GCP_PROJECT
    - gcloud config set run/region $GCP_REGION
    - gcloud config set run/platform $GCP_RUN_PLATFORM
    - export CLOUDSDK_CORE_DISABLE_PROMPTS=1
  script:
    - gcloud alpha run deploy $GCP_RUN_SERVICE_NAME --image $GCP_IMAGE-$CI_COMMIT_REF_SLUG:$VERSION --port=3000
  only:
    - master
  needs: ["build_production"]
