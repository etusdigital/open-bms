stages:
  - test
  # - code_quality_check
  - build
  - deploy

test_code:
  stage: test
  image: node:24-slim
  before_script:
    - corepack enable && corepack prepare pnpm@10.22.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm test:cov
  artifacts:
    name: "%CI_JOB_STAGE%-%CI_COMMIT_REF_NAME%"
    untracked: true
    paths:
      - coverage/
    expire_in: 7 days
  only:
    - merge_requests
    - master
    - staging

