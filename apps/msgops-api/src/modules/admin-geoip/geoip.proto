syntax = "proto3";

// NOTE: this proto is a server-side copy. The shared client copy lives in
// `packages/geo/src/geoip.proto`. Both must stay in sync until they are
// consolidated — see ADR docs/plans/2026-04-30-adr-geo-grpc-architecture.md.

package geoip;

service GeoIpService {
  rpc GetLocation (IpRequest) returns (LocationResponse) {}
  // GetStatus exposes runtime metadata (tier, MMDB size/mtime, last reload,
  // lookup counter) for ops dashboards and the Super Admin UI. Cheap call,
  // safe to poll.
  rpc GetStatus (StatusRequest) returns (StatusResponse) {}
}

message IpRequest {
  string ip = 1; // Can be IPv4 or IPv6
}

message StatusRequest {}

message StatusResponse {
  string tier = 1;             // lite | full | maxmind | api | disabled
  string mmdb_path = 2;
  int64 mmdb_size_bytes = 3;
  int64 mmdb_mtime_ms = 4;     // file mtime as Unix epoch milliseconds
  string last_reload_at = 5;   // ISO 8601 timestamp; empty if never loaded
  int64 lookup_count = 6;      // monotonic counter since process start
  bool ready = 7;              // true when an MMDBReader is loaded
}

// Sourced from DB-IP Full MMDB's `traits` block. Populated with zero
// defaults when the underlying lookup succeeds but no traits exist for
// the IP (e.g. private/reserved ranges). Absent entirely on failed
// lookups (see LocationResponse.success).
message Traits {
  uint32 asn = 1;
  string asn_org = 2;          // autonomous_system_organization
  string isp = 3;
  string organization = 4;
  string user_type = 5;        // hosting | business | residential | cellular | cdn | college | government | dialup
  string connection_type = 6;  // Corporate | Cellular | Cable/DSL | Dialup
  bool is_anycast = 7;
}

message LocationResponse {
  string country = 1; // ISO code
  string region = 2;  // ISO code
  string city = 3;
  string postalCode = 4;
  string timezone = 5;
  double latitude = 6;
  double longitude = 7;
  bool success = 8;   // To indicate if lookup was successful
  string error = 9;   // Error message if any
  Traits traits = 10; // Present on successful lookups; used for bot/datacenter classification
}
