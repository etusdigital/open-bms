x-backend-env: &backend-env
  NODE_ENV: development
  TYPEORM_HOST: postgres
  TYPEORM_PORT: '5432'
  TYPEORM_USERNAME: postgres
  TYPEORM_PASSWORD: postgres
  TYPEORM_DATABASE: msgops
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  RABBITMQ_HOST_PORT: rabbitmq:5672
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
  AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DATABASE: BMS
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ''
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}

x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msgops
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    environment:
      CLICKHOUSE_DB: BMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse-init:/docker-entrypoint-initdb.d
      - ./infra/clickhouse-config/users.d:/etc/clickhouse-server/users.d
    depends_on:
      rabbitmq:
        condition: service_healthy

  msgops-api:
    build:
      context: .
      dockerfile: apps/msgops-api/Dockerfile
    container_name: msgops-api
    ports:
      - '5001:5001'
    env_file:
      - apps/msgops-api/.env
    environment:
      <<: *backend-env
      SERVER_PORT: '5001'
    depends_on: *infra-deps

  event-receiver:
    build:
      context: .
      dockerfile: apps/event-receiver/Dockerfile
    container_name: event-receiver
    ports:
      - '3011:3011'
    environment:
      <<: *backend-env
      PORT: '3011'
    depends_on: *infra-deps

  event-receiver-probe:
    build:
      context: .
      dockerfile: apps/event-receiver-probe/Dockerfile
    container_name: event-receiver-probe
    ports:
      - '3012:3012'
    environment:
      <<: *backend-env
      PORT: '3012'
      BRIDGE_ENDPOINT: http://event-receiver-probe:3012
    depends_on: *infra-deps

  event-process:
    build:
      context: .
      dockerfile: apps/event-process/Dockerfile
    container_name: event-process
    env_file:
      - apps/event-process/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  campaign-packer:
    build:
      context: .
      dockerfile: apps/campaign-packer/Dockerfile
    container_name: campaign-packer
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  campaign-events-tracker:
    build:
      context: .
      dockerfile: apps/campaign-events-tracker/Dockerfile
    container_name: campaign-events-tracker
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  send-email:
    build:
      context: .
      dockerfile: apps/send-email/Dockerfile
    container_name: send-email
    env_file:
      - apps/send-email/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  send-push:
    build:
      context: .
      dockerfile: apps/send-push/Dockerfile
    container_name: send-push
    env_file:
      - apps/send-push/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  send-whatsapp:
    build:
      context: .
      dockerfile: apps/send-whatsapp/Dockerfile
    container_name: send-whatsapp
    env_file:
      - apps/send-whatsapp/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  twilio-messaging:
    build:
      context: .
      dockerfile: apps/twilio-messaging/Dockerfile
    container_name: twilio-messaging
    env_file:
      - apps/twilio-messaging/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  tag-process:
    build:
      context: .
      dockerfile: apps/tag-process/Dockerfile
    container_name: tag-process
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  tracker:
    build:
      context: .
      dockerfile: apps/tracker/Dockerfile
    container_name: tracker
    env_file:
      - apps/tracker/.env
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  email-validation:
    build:
      context: .
      dockerfile: apps/email-validation/Dockerfile
    container_name: email-validation
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

  geolocation:
    build:
      context: .
      dockerfile: apps/geolocation/Dockerfile
    container_name: geolocation
    environment:
      <<: *backend-env
      PORT: '3000'
    depends_on: *infra-deps

volumes:
  clickhouse-data:
  rabbitmq-data:
  postgres-data:
  redis-data:
