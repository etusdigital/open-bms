info:
  name: List Alerts
  type: http
  seq: 2

http:
  method: GET
  url: "{{backoffice-api-url}}/alerts"
  params:
    - name: page
      value: "1"
    - name: pageSize
      value: "20"
    - name: status
      value: "active"
    - name: timezone
      value: "UTC"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
