info:
  name: Get Labels
  type: http
  seq: 1

http:
  method: GET
  url: "{{backoffice-api-url}}/msgops/labels"
  headers:
    - name: account-id
      value: "1"
  auth:
    type: bearer
    token: "{{backoffice-token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
