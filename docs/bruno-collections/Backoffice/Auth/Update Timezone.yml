info:
  name: Update Timezone
  type: http
  seq: 3

http:
  method: POST
  url: '{{backoffice-url}}/api/auth/update-timezone'
  body:
    type: json
    json: |
      {
        "timezone": "America/Sao_Paulo"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
