info:
  name: Validate Email
  type: http
  seq: 1

http:
  method: GET
  url: '{{email-validation-url}}/validate'
  params:
    - name: email
      value: 'user@example.com'
  headers:
    - name: api-key
      value: '{{msgops-api-token}}'
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
