info:
  name: Custom Event
  type: http
  seq: 1

http:
  method: POST
  url: '{{event-process-url}}/custom-events'
  headers:
    - name: platform
      value: 'custom_events'
    - name: x-goog-pubsub-message-id
      value: 'test-custom-event-001'
  body:
    type: json
    json: |
      {
        "eventName": "page_view",
        "contactEmail": "user@example.com",
        "metadata": {}
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
