info:
  name: Internal Event
  type: http
  seq: 1

http:
  method: POST
  url: "{{event-process-url}}/internal"
  headers:
    - name: platform
      value: "internal"
    - name: x-goog-pubsub-message-id
      value: "test-internal-event-001"
  body:
    type: json
    json: |
      {
        "event": "resubscribed",
        "contactEmail": "user@example.com"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
