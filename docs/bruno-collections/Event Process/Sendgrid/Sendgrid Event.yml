info:
  name: Sendgrid Event
  type: http
  seq: 1

http:
  method: POST
  url: "{{event-process-url}}/sendgrid"
  headers:
    - name: platform
      value: "sendgrid"
    - name: x-goog-pubsub-message-id
      value: "test-sendgrid-event-001"
  body:
    type: json
    json: |
      [
        {
          "email": "user@example.com",
          "event": "delivered",
          "sg_event_id": "test-event-id",
          "sg_message_id": "test-message-id",
          "timestamp": 1704067200
        }
      ]
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
