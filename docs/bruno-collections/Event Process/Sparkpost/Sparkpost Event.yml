info:
  name: Sparkpost Event
  type: http
  seq: 1

http:
  method: POST
  url: '{{event-process-url}}/sparkpost'
  headers:
    - name: platform
      value: 'sparkpost'
    - name: x-goog-pubsub-message-id
      value: 'test-sparkpost-event-001'
  body:
    type: json
    json: |
      [
        {
          "msys": {
            "message_event": {
              "type": "delivery",
              "rcpt_to": "user@example.com"
            }
          }
        }
      ]
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
