info:
  name: Send Test Email
  type: http
  seq: 1

http:
  method: POST
  url: '{{msgops-api-url}}/services/send-email'
  body:
    type: json
    json: |
      {
        "to": "test@example.com",
        "subject": "Test Email",
        "content": "<html><body>Hello</body></html>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
