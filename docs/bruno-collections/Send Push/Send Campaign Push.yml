info:
  name: Send Campaign Push
  type: http
  seq: 2

http:
  method: POST
  url: '{{send-push-url}}/'
  body:
    type: json
    json: |
      {
        "campaignId": 1,
        "contacts": [1, 2, 3],
        "accountId": 1
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
