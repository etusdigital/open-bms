info:
  name: Get Contact Details
  type: http
  seq: 4

http:
  method: GET
  url: "{{tracker-url}}/contacts"
  params:
    - name: email
      value: "user@example.com"
    - name: includes
      value: "details,tags,segments"
  headers:
    - name: account-id
      value: "1"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
