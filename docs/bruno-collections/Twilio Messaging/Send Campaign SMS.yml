info:
  name: Send Campaign SMS
  type: http
  seq: 3

http:
  method: POST
  url: "{{twilio-messaging-url}}/campaign"
  body:
    type: json
    json: |
      {
        "campaignId": 1,
        "contacts": [1, 2, 3],
        "accountId": 1
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
