# BMS Open Source — Docker Swarm stack ISOLADA pra teste de carga (EVO-1027).
#
# Deriva de stack.bms-staging.yml. Diferenças:
#   - serviços não necessários pro pipeline campaign→send→ingest removidos
#     (frontend, send-push, send-whatsapp, twilio, tag-process, tracker,
#     message-trigger, campaign-events-tracker, geolocation)
#   - sendgrid-mock adicionado pra absorver envios + disparar eventos
#     sintéticos delivered/open/click sem mandar e-mail real
#   - send-email aponta SENDGRID_API_BASE_URL pro mock interno
#   - network `internal` com attachable: true pra seed/k6 do laptop
#   - postgres/redis/campaign-packer publicados em 127.0.0.1 do manager
#     pra tunelar com `ssh -L` e rodar o harness do laptop
#   - sem Traefik labels, sem network_public (stack não recebe tráfego externo)
#
# Pré-requisito no manager (one-time):
#   - docker load < bms-sendgrid-mock-loadtest.tar (build local + save/load)
#
# Deploy (do laptop):
#   STACK_NAME=bms-loadtest STACK_FILE=infra/swarm/stack.bms-loadtest.yml \
#     DOCKER_HOST=ssh://evolution_manager bash infra/swarm/deploy.sh
#
# Teardown:
#   DOCKER_HOST=ssh://evolution_manager docker stack rm bms-loadtest
#   DOCKER_HOST=ssh://evolution_manager docker volume ls -q | grep ^bms-loadtest_ | \
#     xargs -r -I{} docker -H ssh://evolution_manager volume rm {}

version: '3.9'

x-restart-policy: &restart-policy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 0

x-restart-once: &restart-once
  restart_policy:
    condition: none

# Para one-shots que dependem de outro serviço estar pronto (e.g.
# minio-bootstrap precisa que minio resolva), usamos on-failure com
# retries pra cobrir o race de startup. Após sucesso, não reroda.
x-restart-once-with-retry: &restart-once-with-retry
  restart_policy:
    condition: on-failure
    max_attempts: 10
    delay: 5s

x-backend-env: &backend-env
  NODE_ENV: production
  TYPEORM_HOST: postgres
  TYPEORM_PORT: '5432'
  TYPEORM_USERNAME: postgres
  TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
  TYPEORM_DATABASE: msgops
  TYPEORM_MIGRATIONS_RUN: 'true'
  TYPEORM_SYNCHRONIZE: 'false'
  TYPEORM_SSL: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  RABBITMQ_HOST_PORT: rabbitmq:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-bms}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
  AMQP_URL: amqp://${RABBITMQ_USER:-bms}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DATABASE: BMS
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ''
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?must set INTERNAL_AUTH_TOKEN}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: msgops
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bmsadmin}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
  AUTH_PROVIDER: local
  JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET}
  CRON_SECRET: ${CRON_SECRET:?must set CRON_SECRET}
  JWT_AUDIENCE: bms-msgops-api
  JWT_ACCESS_TTL: '3600'
  JWT_REFRESH_TTL: '2592000'
  API_DOCS: /api-docs
  FRONTEND_URL: https://bms-staging.evo-ai.co
  CORS_ORIGINS: https://bms-staging.evo-ai.co
  # SendGrid settings come from super-admin UI → system_config → bms-config/sendgrid.env (loaded at boot).
  # Provide harmless placeholder so msgops-api SendGridHandler boot doesn't trip the eager-SDK guard.
  SENDGRID_API_KEY: dev-placeholder-not-a-real-key
  SENDGRID_KEYS_MAP: '{"plusdin-campaigns":"dev"}'
  SPARKPOST_API_KEY: dev-placeholder-not-a-real-key
  OPEN_AI_KEY: dev-placeholder-not-a-real-key
  LIMIT_CONTACT_BATCH: '1000'
  CAMPAIGN_TRIGGER_ENDPOINT: ${CAMPAIGN_TRIGGER_ENDPOINT:-http://campaign-packer:3000/create-contacts-send}
  CAMPAIGN_TEST_AB_ENDPOINT: ${CAMPAIGN_TEST_AB_ENDPOINT:-http://campaign-packer:3000/create-test}
  CAMPAIGN_RESULT_TEST_AB_ENDPOINT: ${CAMPAIGN_RESULT_TEST_AB_ENDPOINT:-http://campaign-packer:3000/result-test}
  # tag-process loopback for scheduled segment recalculation. Without this,
  # tags.service.ts builds `undefined/<id>` and every SegmentProcessor dispatch
  # fails with "Failed to parse URL" — segments never get a count (EVO-1433).
  TAG_PROCESS_ENDPOINT: ${TAG_PROCESS_ENDPOINT:-http://tag-process:3000/process-segment}
  # message-trigger queue topics — call sites look up by env var, not constant.
  TOPIC_NAME_MESSAGE_TRIGGER: ${TOPIC_NAME_MESSAGE_TRIGGER:-message-trigger}
  TOPIC_NAME_SEND_EMAIL: ${TOPIC_NAME_SEND_EMAIL:-send-email}
  TOPIC_NAME_SEND_PUSH: ${TOPIC_NAME_SEND_PUSH:-send-push}
  TOPIC_NAME_SEND_TWILIO: ${TOPIC_NAME_SEND_TWILIO:-send-twilio}
  TOPIC_NAME_SEND_WHATSAPP: ${TOPIC_NAME_SEND_WHATSAPP:-send-whatsapp}
  TOPIC_NAME_HTTP_REQUEST: ${TOPIC_NAME_HTTP_REQUEST:-http-request}
  TOPIC_NAME_TAG_PROCESS: ${TOPIC_NAME_TAG_PROCESS:-tag-process}
  TOPIC_NAME_EVENT_PROCESS: ${TOPIC_NAME_EVENT_PROCESS:-event-process}

services:
  # === infra ===

  postgres:
    image: postgres:16-alpine
    # Publica em 127.0.0.1:55432 do manager pra seed via SSH tunnel.
    # Bind em loopback do manager → não exposto fora do host.
    ports:
      - target: 5432
        published: 55432
        protocol: tcp
        mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: msgops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    # Publica em 127.0.0.1:56379 do manager pra drain-check via SSH tunnel.
    ports:
      - target: 6379
        published: 56379
        protocol: tcp
        mode: host
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 1G

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-bmsadmin} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/msgops &&
        echo "MinIO bucket msgops ready"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    networks: [internal]
    deploy:
      <<: *restart-once-with-retry

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: BMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      # Consumed by the 02-events-rabbitmq.sh init script to wire the
      # RabbitMQ-engine table. Without these the script falls back to
      # guest/guest and the analytics pipeline never authenticates.
      RABBITMQ_HOST_PORT: rabbitmq:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-bms}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse-init-01
        target: /docker-entrypoint-initdb.d/01-init-bms.sql
      - source: clickhouse-init-02
        target: /docker-entrypoint-initdb.d/02-events-rabbitmq.sh
        mode: 0755
      - source: clickhouse-users-experimental
        target: /etc/clickhouse-server/users.d/00-experimental.xml
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 4G

  bms-config-init:
    image: alpine:3.20
    volumes:
      - bms-config:/data/config
    entrypoint: ['/bin/sh', '-c', 'chown 1001:1001 /data/config']
    deploy:
      <<: *restart-once

  # === apps ===

  msgops-api:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-msgops-api:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      SERVER_PORT: '5001'
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config
    # Não precisa de network_public — msgops-api não recebe tráfego direto
    # do Traefik. O nginx do frontend-react faz proxy_pass com strip de /api/.
    networks: [internal]
    healthcheck:
      # /api-docs (Swagger) é desabilitado em produção (main.ts:53). Usa
      # /setup/status que é @PublicRoute() e existe em prod. Origin
      # header é necessário porque cors.config.ts:22 rejeita requests
      # sem Origin em produção.
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          '--header',
          'Origin: https://bms-staging.evo-ai.co',
          'http://127.0.0.1:5001/setup/status',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M

  event-receiver:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-event-receiver:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3011'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  event-process:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-event-process:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      # main.ts exige BRIDGE_ENDPOINT explícito quando NODE_ENV=production.
      BRIDGE_ENDPOINT: http://localhost:3000
      # Geolocation service não está no loadtest stack — desabilitar
      # enrichment pra evitar timeout chamando geolocation:50051.
      GEO_ENRICHMENT_ENABLED: 'false'
      # event-process uses a separate `pg` Pool driven by DATABASE_* envs
      # (db.provider.ts). Without these the SendgridService.processSendgrid
      # path hits ECONNREFUSED and webhooks pile up in the DLQ.
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_DATABASE: msgops
      DATABASE_LOGS_HOST: postgres
      DATABASE_LOGS_PORT: '5432'
      DATABASE_LOGS_USERNAME: postgres
      DATABASE_LOGS_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_LOGS_DATABASE: msgops
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M

  send-email:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-send-email:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
      BMS_CONFIG_DIR: /data/config
      # EVO-1052 override: nenhum e-mail real sai durante o load test, tudo
      # cai no sendgrid-mock que responde 2xx + dispara delivered/open/click.
      SENDGRID_API_BASE_URL: http://sendgrid-mock:3010
      # SDK do SendGrid valida que a key começa com "SG." mesmo apontando
      # pro mock. Override do dev-placeholder pra um valor SG.* qualquer.
      SENDGRID_API_KEY: SG.LOADTEST_PLACEHOLDER_KEY
    volumes:
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  sendgrid-mock:
    image: bms-sendgrid-mock:loadtest
    # Publica em 127.0.0.1:53010 do manager pra o seed registrar o webhook
    # via SSH tunnel (POST /v3/user/webhooks/event/settings).
    ports:
      - target: 3010
        published: 53010
        protocol: tcp
        mode: host
    environment:
      PORT: '3010'
      MOCK_EVENT_DELAY_MS: ${SENDGRID_MOCK_EVENT_DELAY_MS:-500}
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 128M

  campaign-packer:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-campaign-packer:${IMAGE_TAG:?must set IMAGE_TAG}
    # Publica em 127.0.0.1:53000 do manager pra k6 disparar via SSH tunnel.
    ports:
      - target: 3000
        published: 53000
        protocol: tcp
        mode: host
    environment:
      <<: *backend-env
      PORT: '3000'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clickhouse-data:
  bms-config:

networks:
  # Rede interna do stack — attachable pra seed/k6 do laptop conseguirem
  # entrar via `docker run --network bms-loadtest_internal ...`.
  internal:
    driver: overlay
    attachable: true

configs:
  # Caminhos relativos a este arquivo (infra/swarm/stack.bms-staging.yml).
  clickhouse-init-01:
    file: ../clickhouse-init/01-init-bms.sql
  clickhouse-init-02:
    file: ../clickhouse-init/02-events-rabbitmq.sh
  clickhouse-users-experimental:
    file: ../clickhouse-config/users.d/00-experimental.xml
