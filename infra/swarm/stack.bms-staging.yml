# BMS Open Source v0.1.0 — Docker Swarm stack para staging em manager1.evo-ai.co
#
# Sub-stack `bms-staging` rodando junto dos demais serviços do manager.
# Derivado de docker-compose.yml raiz com adaptações pra Swarm:
#   - sem `build:` (imagens vêm do Docker Hub da organização)
#   - sem `container_name` (Swarm gera nome `<stack>_<service>.<task>.<id>`)
#   - sem `depends_on.condition: service_healthy` (Swarm ignora; restart policy + healthchecks reconciliam)
#   - portas internas não expostas no host; ingress público via Traefik existente
#
# Pré-requisitos no manager (one-time):
#   1. scp data/geo/dbip-city-lite.mmdb manager1:/opt/bms-staging/data/geo/
#   2. mkdir -p /opt/bms-staging/data/geo (já implícito no scp)
#   3. DNS Cloudflare: bms-staging.evo-ai.co → IP do manager
#   4. SendGrid API key + webhook URL configurados via super-admin UI APÓS primeiro boot
#
# Deploy:
#   IMAGE_TAG=bms-staging-<sha7> docker stack deploy -c stack.bms-staging.yml bms-staging
#
# Rollback:
#   docker stack rm bms-staging  (volumes ficam pra inspeção)

version: '3.9'

x-restart-policy: &restart-policy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 0

x-restart-once: &restart-once
  restart_policy:
    condition: none

# Para one-shots que dependem de outro serviço estar pronto (e.g.
# minio-bootstrap precisa que minio resolva), usamos on-failure com
# retries pra cobrir o race de startup. Após sucesso, não reroda.
x-restart-once-with-retry: &restart-once-with-retry
  restart_policy:
    condition: on-failure
    max_attempts: 10
    delay: 5s

x-backend-env: &backend-env
  NODE_ENV: production
  TYPEORM_HOST: postgres
  TYPEORM_PORT: '5432'
  TYPEORM_USERNAME: postgres
  TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
  TYPEORM_DATABASE: msgops
  TYPEORM_MIGRATIONS_RUN: 'true'
  TYPEORM_SYNCHRONIZE: 'false'
  TYPEORM_SSL: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  RABBITMQ_HOST_PORT: rabbitmq:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-bms}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
  AMQP_URL: amqp://${RABBITMQ_USER:-bms}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DATABASE: BMS
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ''
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?must set INTERNAL_AUTH_TOKEN}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: msgops
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bmsadmin}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
  AUTH_PROVIDER: local
  JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET}
  CRON_SECRET: ${CRON_SECRET:?must set CRON_SECRET}
  JWT_AUDIENCE: bms-msgops-api
  JWT_ACCESS_TTL: '3600'
  JWT_REFRESH_TTL: '2592000'
  API_DOCS: /api-docs
  FRONTEND_URL: https://bms-staging.evo-ai.co
  CORS_ORIGINS: https://bms-staging.evo-ai.co
  # SendGrid settings come from super-admin UI → system_config → bms-config/sendgrid.env (loaded at boot).
  # Provide harmless placeholder so msgops-api SendGridHandler boot doesn't trip the eager-SDK guard.
  SENDGRID_API_KEY: dev-placeholder-not-a-real-key
  SENDGRID_KEYS_MAP: '{"plusdin-campaigns":"dev"}'
  SPARKPOST_API_KEY: dev-placeholder-not-a-real-key
  OPEN_AI_KEY: dev-placeholder-not-a-real-key
  LIMIT_CONTACT_BATCH: '1000'
  CAMPAIGN_TRIGGER_ENDPOINT: ${CAMPAIGN_TRIGGER_ENDPOINT:-http://campaign-packer:3000/create-contacts-send}
  CAMPAIGN_TEST_AB_ENDPOINT: ${CAMPAIGN_TEST_AB_ENDPOINT:-http://campaign-packer:3000/create-test}
  CAMPAIGN_RESULT_TEST_AB_ENDPOINT: ${CAMPAIGN_RESULT_TEST_AB_ENDPOINT:-http://campaign-packer:3000/result-test}

services:
  # === infra ===

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: msgops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 1G

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-bmsadmin} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/msgops &&
        echo "MinIO bucket msgops ready"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    networks: [internal]
    deploy:
      <<: *restart-once-with-retry

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: BMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse-init-01
        target: /docker-entrypoint-initdb.d/01-init-bms.sql
      - source: clickhouse-init-02
        target: /docker-entrypoint-initdb.d/02-events-rabbitmq.sh
        mode: 0755
      - source: clickhouse-users-experimental
        target: /etc/clickhouse-server/users.d/00-experimental.xml
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 4G

  bms-config-init:
    image: alpine:3.20
    volumes:
      - bms-config:/data/config
    entrypoint: ['/bin/sh', '-c', 'chown 1001:1001 /data/config']
    deploy:
      <<: *restart-once

  # === apps ===

  msgops-api:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-msgops-api:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      SERVER_PORT: '5001'
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config
    # Não precisa de network_public — msgops-api não recebe tráfego direto
    # do Traefik. O nginx do frontend-react faz proxy_pass com strip de /api/.
    networks: [internal]
    healthcheck:
      # /api-docs (Swagger) é desabilitado em produção (main.ts:53). Usa
      # /setup/status que é @PublicRoute() e existe em prod. Origin
      # header é necessário porque cors.config.ts:22 rejeita requests
      # sem Origin em produção.
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          '--header',
          'Origin: https://bms-staging.evo-ai.co',
          'http://127.0.0.1:5001/setup/status',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M
      labels:
        # Traefik não roteia /api diretamente para cá.
        # O nginx do frontend-react faz proxy_pass http://msgops-api:5001/
        # com strip do prefixo /api/ — e as rotas NestJS não têm prefixo /api.
        - traefik.enable=false

  frontend-react:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-frontend-react:${IMAGE_TAG:?must set IMAGE_TAG}
    # `internal`: nginx resolve `msgops-api` para proxy_pass no startup.
    # `network_public`: Traefik precisa desta rede para rotear tráfego ao frontend.
    networks: [internal, network_public]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.bms-ui.rule=Host(`bms-staging.evo-ai.co`)
        - traefik.http.routers.bms-ui.entrypoints=websecure
        - traefik.http.routers.bms-ui.tls.certresolver=letsencryptresolver
        - traefik.http.routers.bms-ui.priority=10
        - traefik.http.services.bms-ui.loadbalancer.server.port=80

  event-receiver:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-event-receiver:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3011'
    networks: [internal, network_public]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.bms-events.rule=Host(`bms-staging.evo-ai.co`) && PathPrefix(`/bms/events`)
        - traefik.http.routers.bms-events.entrypoints=websecure
        - traefik.http.routers.bms-events.tls.certresolver=letsencryptresolver
        - traefik.http.routers.bms-events.priority=30
        - traefik.http.services.bms-events.loadbalancer.server.port=3011

  event-process:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-event-process:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      # main.ts exige BRIDGE_ENDPOINT explícito quando NODE_ENV=production.
      BRIDGE_ENDPOINT: http://localhost:3000
      GEOIP_SERVICE_URL: geolocation:50051
      GEO_GRPC_URL: geolocation:50051
      GEO_ENRICHMENT_ENABLED: 'true'
      GEO_PROVIDER: local
      # event-process uses a separate `pg` Pool driven by DATABASE_* envs
      # (db.provider.ts). Without these the SendgridService.processSendgrid
      # path hits ECONNREFUSED and webhooks pile up in the DLQ.
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_DATABASE: msgops
      DATABASE_LOGS_HOST: postgres
      DATABASE_LOGS_PORT: '5432'
      DATABASE_LOGS_USERNAME: postgres
      DATABASE_LOGS_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_LOGS_DATABASE: msgops
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M

  send-email:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-send-email:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  send-push:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-send-push:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  send-whatsapp:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-send-whatsapp:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  twilio-messaging:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-twilio-messaging:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  campaign-events-tracker:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-campaign-events-tracker:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  campaign-packer:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-campaign-packer:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      LOG_LEVEL: INFO
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  tracker:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-tracker:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  tag-process:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-tag-process:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      # main.ts exige BRIDGE_ENDPOINT explícito quando NODE_ENV=production.
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  geolocation:
    image: ${IMAGE_REGISTRY:-evoapicloud}/bms-geolocation:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '50051'
      GEO_MMDB_DIR: /data/geo
      BMS_CONFIG_DIR: /data/config
    volumes:
      # Pré-requisito: scp data/geo/dbip-city-lite.mmdb manager1:/opt/bms-staging/data/geo/
      - /opt/bms-staging/data/geo:/data/geo:ro
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clickhouse-data:
  bms-config:

networks:
  # Overlay attachable já existente no manager (Traefik vive aqui).
  network_public:
    external: true
  # Rede interna do stack — apps + infra falam aqui.
  internal:
    driver: overlay
    attachable: false

configs:
  # Caminhos relativos a este arquivo (infra/swarm/stack.bms-staging.yml).
  clickhouse-init-01:
    file: ../clickhouse-init/01-init-bms.sql
  clickhouse-init-02:
    file: ../clickhouse-init/02-events-rabbitmq.sh
  clickhouse-users-experimental:
    file: ../clickhouse-config/users.d/00-experimental.xml
