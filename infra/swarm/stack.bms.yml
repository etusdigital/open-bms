# =============================================================================
#  BMS Open Source — Docker Swarm stack (Portainer-ready)
# =============================================================================
#
#  Guia completo de deploy: infra/swarm/DEPLOY.md
#
# -----------------------------------------------------------------------------
#  PRÉ-REQUISITOS (one-time, antes de subir o stack)
# -----------------------------------------------------------------------------
#
#  1) DNS público apontando 2 hostnames pro IP do manager:
#       • <FRONTEND_HOST>  ex.: bms-app.exemplo.ai      (app + API + webhooks)
#       • <CH_UI_HOST>     ex.: ch-ui-bms.exemplo.ai    (console ClickHouse)
#
#  2) Swarm configs criados via Portainer (Configs → Add config) ou via CLI.
#     Os 3 configs precisam EXISTIR antes do deploy do stack.
#     Conteúdo em: infra/clickhouse-init/ e infra/clickhouse-config/users.d/
#
#       • clickhouse-init-01            ← conteúdo de 01-init-bms.sql
#       • clickhouse-init-02-auth       ← conteúdo de 02-events-rabbitmq.sh
#       • clickhouse-users-experimental ← conteúdo de 00-experimental.xml
#
#     ⚠️  Swarm configs são imutáveis. Pra atualizar conteúdo, crie versão nova
#         (ex.: clickhouse-init-01-v2) e atualize a referência abaixo.
#
#  3) Traefik v3 rodando na overlay externa `network_public` (nome real: bmsNet
#     no nosso staging — ajustar embaixo se diferente). Use stack.traefik.yml
#     deste repo se ainda não tem Traefik. Timeouts longos (600s) são obrigatórios
#     pra cobrir operações longas no msgops-api (import enterprise, exports).
#
#  4) Imagens publicadas em ${IMAGE_REGISTRY}/bms-*:${IMAGE_TAG}. Verificar que
#     bms-enterprise-import existe — sem ela o stack falha. Build local no
#     manager via `docker build -f apps/enterprise-import/Dockerfile ...`
#     se ainda não estiver no Docker Hub.
#
# -----------------------------------------------------------------------------
#  VARIÁVEIS DE AMBIENTE (todas obrigatórias — colocar em Portainer → Stack →
#  Environment variables, ou usar stack.env no caso de deploy via Repository)
# -----------------------------------------------------------------------------
#
#  Hosts / imagens:
#    FRONTEND_HOST                       ex.: bms-app.exemplo.ai
#    CH_UI_HOST                          ex.: ch-ui-bms.exemplo.ai
#    FRONTEND_URL                        ex.: https://bms-app.exemplo.ai
#    CORS_ORIGINS                        ex.: https://bms-app.exemplo.ai
#    IMAGE_REGISTRY                      ex.: etusdigital
#    IMAGE_TAG                           ex.: latest  ou  bms-<sha7>
#
#  Senhas / segredos (gerar com `openssl rand -base64 N`):
#    POSTGRES_PASSWORD                   `openssl rand -base64 24`
#    RABBITMQ_PASSWORD                   `openssl rand -base64 24`
#    CLICKHOUSE_PASSWORD                 `openssl rand -base64 24`
#    MINIO_ROOT_PASSWORD                 `openssl rand -base64 24`
#    JWT_SECRET                          `openssl rand -base64 48`
#    CRON_SECRET                         `openssl rand -base64 32`
#    INTERNAL_AUTH_TOKEN                 `openssl rand -base64 32`
#    CH_UI_SECRET_KEY                    `openssl rand -base64 32`
#    ENTERPRISE_IMPORT_ENCRYPTION_KEY    `openssl rand -base64 32`  (AES-256,
#                                         32 bytes. PERDER = dados cifrados
#                                         ficam ilegíveis — guardar em cofre.)
#
#  Opcionais (têm defaults):
#    RABBITMQ_USER                       default: bms
#    MINIO_ROOT_USER                     default: bmsadmin
#    TRAEFIK_NETWORK_NAME                default: bmsNet
#                                         (rede overlay externa onde Traefik vive)
#    BMS_PUBLIC_URL                      default: ${FRONTEND_URL}
#                                         URL pública que a Meta / EvoHub usa pra entregar
#                                         webhooks. Só sobrescreva se for diferente do FRONTEND_URL.
#    WHATSAPP_PROVIDER                   default: cloud
#                                         'cloud' (Meta direta ou via EvoHub) ou 'twilio' (legacy).
#    WHATSAPP_GRAPH_VERSION              default: v18.0
#    EVOLUTION_HUB_URL                   default: https://api.evohub.ai
#    EVOLUTION_HUB_ENABLED               default: false
#
#  WhatsApp Cloud / EvoHub credentials (TODAS opcionais — configuradas via
#  Super Admin → Integrações → WhatsApp após primeiro boot. Persistidas em
#  system_config; ENV só serve de fallback se a UI nunca foi configurada):
#    WHATSAPP_APP_ID                     Meta App ID (modo Meta direto)
#    WHATSAPP_APP_SECRET                 Meta App Secret
#    WHATSAPP_CONFIG_ID                  Embedded Signup Config ID
#    WHATSAPP_VERIFY_TOKEN               Token GET webhook Meta
#    EVOLUTION_HUB_API_KEY               Bearer tenant no Hub
#    EVOLUTION_HUB_WEBHOOK_SECRET        HMAC-SHA256 Hub ↔ BMS
#
# -----------------------------------------------------------------------------
#  DEPLOY VIA PORTAINER
# -----------------------------------------------------------------------------
#
#  1) Portainer → Configs → Add config (3x, conforme §2 dos pré-requisitos).
#  2) Portainer → Stacks → Add stack → Web editor.
#  3) Cole este YAML.
#  4) Em "Environment variables" cole TODAS as envs da lista acima.
#  5) Deploy the stack.
#  6) Aguardar ~2 min, verificar `Stacks → bms → Services` — todos 1/1 exceto
#     bms-config-init e minio-bootstrap (one-shots — 0/1 é normal).
#  7) Acessar https://<FRONTEND_HOST>/setup pro wizard.
#
# -----------------------------------------------------------------------------
#  DEPLOY VIA CLI (alternativa)
# -----------------------------------------------------------------------------
#
#  export <todas as envs acima>
#  docker stack deploy -c stack.bms.yml --resolve-image=always bms
#
# -----------------------------------------------------------------------------
#  ROLLBACK
# -----------------------------------------------------------------------------
#
#  docker stack rm bms                              (volumes preservados)
#  docker volume rm $(docker volume ls -q | grep ^bms_)  (apaga TUDO — cuidado)
#
# -----------------------------------------------------------------------------
#  NOTAS DE DESIGN
# -----------------------------------------------------------------------------
#
#  • Adaptado do docker-compose.yml raiz: sem `build:` (imagens prontas no Hub),
#    sem `container_name` (Swarm gera <stack>_<service>.<task>.<id>), sem
#    `depends_on.condition: service_healthy` (Swarm ignora — restart policy +
#    healthchecks reconciliam).
#  • msgops-api roteia /api/* diretamente via Traefik com StripPrefix. SEM nginx
#    no meio (o nginx do frontend-react tinha proxy_read_timeout 60s que matava
#    operações longas — import enterprise, exports).
#  • frontend-react só na network_public — sem precisar resolver msgops-api
#    internamente (Traefik separa as rotas).
#  • enterprise-import é um worker BullMQ que consome jobs enfileirados pelo
#    msgops-api em POST /accounts/import. Sem ele, jobs ficam status=pending
#    pra sempre.
#  • geolocation usa volume nomeado `geo-data` (não bind mount no host). Pra
#    popular o GeoIP mmdb depois:
#      docker cp dbip-city-lite.mmdb <container>:/data/geo/
#
# =============================================================================

version: '3.9'

x-restart-policy: &restart-policy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 0

x-restart-once: &restart-once
  restart_policy:
    condition: none

# Para one-shots que dependem de outro serviço estar pronto (e.g.
# minio-bootstrap precisa que minio resolva), usamos on-failure com
# retries pra cobrir o race de startup. Após sucesso, não reroda.
x-restart-once-with-retry: &restart-once-with-retry
  restart_policy:
    condition: on-failure
    max_attempts: 10
    delay: 5s

x-backend-env: &backend-env
  NODE_ENV: production
  TYPEORM_HOST: postgres
  TYPEORM_PORT: '5432'
  TYPEORM_USERNAME: postgres
  TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
  TYPEORM_DATABASE: msgops
  TYPEORM_MIGRATIONS_RUN: 'true'
  TYPEORM_SYNCHRONIZE: 'false'
  TYPEORM_SSL: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  RABBITMQ_HOST_PORT: rabbitmq:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-bms}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
  AMQP_URL: amqp://${RABBITMQ_USER:-bms}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DATABASE: BMS
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?must set CLICKHOUSE_PASSWORD}
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?must set INTERNAL_AUTH_TOKEN}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: msgops
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bmsadmin}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
  AUTH_PROVIDER: local
  JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET}
  CRON_SECRET: ${CRON_SECRET:?must set CRON_SECRET}
  JWT_AUDIENCE: bms-msgops-api
  JWT_ACCESS_TTL: '3600'
  JWT_REFRESH_TTL: '2592000'
  API_DOCS: /api-docs
  FRONTEND_URL: ${FRONTEND_URL:?must set FRONTEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:?must set CORS_ORIGINS}
  # SendGrid settings come from super-admin UI → system_config → bms-config/sendgrid.env (loaded at boot).
  # Provide harmless placeholder so msgops-api SendGridHandler boot doesn't trip the eager-SDK guard.
  SENDGRID_API_KEY: dev-placeholder-not-a-real-key
  SENDGRID_KEYS_MAP: '{"plusdin-campaigns":"dev"}'
  SPARKPOST_API_KEY: dev-placeholder-not-a-real-key
  OPEN_AI_KEY: dev-placeholder-not-a-real-key
  # Habilita o módulo Enterprise Import (rota POST /accounts/import + GET /imports/:jobId).
  # Sem essa flag, EnterpriseImportEnabledGuard retorna 404 em todas as rotas
  # do módulo — gate intencional pra esconder a feature em instalações que não
  # vão migrar do Enterprise.
  ENTERPRISE_IMPORT_ENABLED: 'true'
  # Chave AES-256 (base64, 32 bytes) usada pra cifrar a API key do Enterprise
  # no banco. Gere com:  openssl rand -base64 32
  # Sem essa env, o endpoint POST /accounts/import dá 500 com a mensagem
  # "ENTERPRISE_IMPORT_ENCRYPTION_KEY not set" (api-key-encryption.util.ts).
  ENTERPRISE_IMPORT_ENCRYPTION_KEY: ${ENTERPRISE_IMPORT_ENCRYPTION_KEY:?must set ENTERPRISE_IMPORT_ENCRYPTION_KEY}
  LIMIT_CONTACT_BATCH: '1000'
  CAMPAIGN_TRIGGER_ENDPOINT: ${CAMPAIGN_TRIGGER_ENDPOINT:-http://campaign-packer:3000/create-contacts-send}
  CAMPAIGN_TEST_AB_ENDPOINT: ${CAMPAIGN_TEST_AB_ENDPOINT:-http://campaign-packer:3000/create-test}
  CAMPAIGN_RESULT_TEST_AB_ENDPOINT: ${CAMPAIGN_RESULT_TEST_AB_ENDPOINT:-http://campaign-packer:3000/result-test}
  # tag-process loopback for scheduled segment recalculation. Without this,
  # tags.service.ts builds `undefined/<id>` and every SegmentProcessor dispatch
  # fails with "Failed to parse URL" — segments never get a count (EVO-1433).
  TAG_PROCESS_ENDPOINT: ${TAG_PROCESS_ENDPOINT:-http://tag-process:3000/process-segment}
  # message-trigger queue topics — call sites look up by env var, not constant.
  TOPIC_NAME_MESSAGE_TRIGGER: ${TOPIC_NAME_MESSAGE_TRIGGER:-message-trigger}
  TOPIC_NAME_SEND_EMAIL: ${TOPIC_NAME_SEND_EMAIL:-send-email}
  TOPIC_NAME_SEND_PUSH: ${TOPIC_NAME_SEND_PUSH:-send-push}
  TOPIC_NAME_SEND_TWILIO: ${TOPIC_NAME_SEND_TWILIO:-send-twilio}
  TOPIC_NAME_SEND_WHATSAPP: ${TOPIC_NAME_SEND_WHATSAPP:-send-whatsapp}
  TOPIC_NAME_HTTP_REQUEST: ${TOPIC_NAME_HTTP_REQUEST:-http-request}
  TOPIC_NAME_TAG_PROCESS: ${TOPIC_NAME_TAG_PROCESS:-tag-process}
  TOPIC_NAME_EVENT_PROCESS: ${TOPIC_NAME_EVENT_PROCESS:-event-process}
  # WhatsApp Cloud (Meta direct ou via EvoHub) — substitui a integração antiga
  # Evolution API. Detalhes operacionais: docs/operations/whatsapp-cloud.md.
  #
  # Credenciais reais (APP_ID/SECRET, HUB_API_KEY etc.) ficam vazias aqui de
  # propósito: o Super Admin → Integrações → WhatsApp persiste tudo em
  # system_config (DB) e o backend lê de lá primeiro; env só é fallback se
  # a UI ainda não foi configurada. Não defina como :? — quebraria o boot.
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloud}
  WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v18.0}
  WHATSAPP_APP_ID: ${WHATSAPP_APP_ID:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_CONFIG_ID: ${WHATSAPP_CONFIG_ID:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  EVOLUTION_HUB_ENABLED: ${EVOLUTION_HUB_ENABLED:-false}
  EVOLUTION_HUB_URL: ${EVOLUTION_HUB_URL:-https://api.evohub.ai}
  EVOLUTION_HUB_API_KEY: ${EVOLUTION_HUB_API_KEY:-}
  EVOLUTION_HUB_WEBHOOK_SECRET: ${EVOLUTION_HUB_WEBHOOK_SECRET:-}
  # URL pública que Meta / EvoHub usam para entregar webhooks de volta ao BMS.
  # Default = FRONTEND_URL (mesma URL do app). Sobrescreva só se houver split
  # entre URL do app e URL do webhook (ex: webhook num subdomínio dedicado).
  BMS_PUBLIC_URL: ${BMS_PUBLIC_URL:-${FRONTEND_URL}}

services:
  # === infra ===

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: msgops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 2G

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 1G

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-bmsadmin} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/msgops &&
        echo "MinIO bucket msgops ready"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    networks: [internal]
    deploy:
      <<: *restart-once-with-retry

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: BMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?must set CLICKHOUSE_PASSWORD}
      # SKIP_USER_SETUP removed: with it set the entrypoint ignored
      # CLICKHOUSE_PASSWORD and the `default` user stayed open. Letting user
      # setup run applies the password to `default` on every container start.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      # Consumed by the 02-events-rabbitmq.sh init script to wire the
      # RabbitMQ-engine table. Without these the script falls back to
      # guest/guest and the analytics pipeline never authenticates.
      RABBITMQ_HOST_PORT: rabbitmq:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-bms}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?must set RABBITMQ_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse-init-01
        target: /docker-entrypoint-initdb.d/01-init-bms.sql
      # -auth suffix: Swarm configs are immutable, so the content change
      # (clickhouse-client now passes --user/--password) needs a new name.
      - source: clickhouse-init-02-auth
        target: /docker-entrypoint-initdb.d/02-events-rabbitmq.sh
        mode: 0755
      - source: clickhouse-users-experimental
        target: /etc/clickhouse-server/users.d/00-experimental.xml
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 4G

  # CH-UI: web console for the analytics ClickHouse.
  # Browser → Traefik → ch-ui (3488). The ch-ui server opens the ClickHouse
  # connection itself over the `internal` network, so ClickHouse stays
  # unexposed — only ch-ui is reachable from outside.
  # Prereq: DNS apontando ${CH_UI_HOST} → IP do manager.
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:v2.1.1
    environment:
      NODE_ENV: production
      PORT: '3488'
      APP_URL: https://${CH_UI_HOST:?must set CH_UI_HOST}
      ALLOWED_ORIGINS: https://${CH_UI_HOST}
      # Signs ch-ui session cookies — without it ch-ui falls back to a
      # hardcoded default key. ch-ui has its own login/user accounts.
      APP_SECRET_KEY: ${CH_UI_SECRET_KEY:?must set CH_UI_SECRET_KEY}
      # Seeds only the host — ch-ui's client takes user/pass as separate
      # fields, not from the URL. On first login, open the seeded connection
      # and enter user `default` + CLICKHOUSE_PASSWORD; ch-ui persists it in
      # its own SQLite (ch-ui-data volume).
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: BMS
    volumes:
      - ch-ui-data:/app/data
    networks: [internal, network_public]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3488/health']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.bms-ch-ui.rule=Host(`${CH_UI_HOST}`)
        - traefik.http.routers.bms-ch-ui.entrypoints=websecure
        - traefik.http.routers.bms-ch-ui.tls.certresolver=letsencryptresolver
        - traefik.http.routers.bms-ch-ui.priority=20
        # No edge basic-auth: ch-ui v2 has its own login/user accounts
        # (APP_SECRET_KEY-signed sessions) — that is the only gate.
        - traefik.http.services.bms-ch-ui.loadbalancer.server.port=3488

  bms-config-init:
    image: alpine:3.20
    volumes:
      - bms-config:/data/config
    entrypoint: ['/bin/sh', '-c', 'chown 1001:1001 /data/config']
    deploy:
      <<: *restart-once

  # === apps ===

  msgops-api:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-msgops-api:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      SERVER_PORT: '5001'
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config
    # network_public: Traefik faz proxy direto para cá em /api/*.
    # internal: ainda fala com postgres, redis, rabbitmq, clickhouse, minio.
    networks: [internal, network_public]
    healthcheck:
      # /api-docs (Swagger) é desabilitado em produção (main.ts:53). Usa
      # /setup/status que é @PublicRoute() e existe em prod. Origin
      # header é necessário porque cors.config.ts:22 rejeita requests
      # sem Origin em produção.
      test:
        ['CMD', 'wget', '--spider', '-q', '--header', 'Origin: ${FRONTEND_HOST}', 'http://127.0.0.1:5001/setup/status']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M
      labels:
        # Traefik roteia ${FRONTEND_HOST}/api/* direto pra cá.
        # Antes passava pelo nginx do frontend-react (proxy_read_timeout 60s),
        # que matava operações longas como import enterprise. Sem nginx no meio,
        # operações longas (import, exports, bulk) usam o timeout do entrypoint
        # do Traefik (configurado em 600s no service traefik externo).
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.bms-api.rule=Host(`${FRONTEND_HOST}`) && PathPrefix(`/api`)
        - traefik.http.routers.bms-api.entrypoints=websecure
        - traefik.http.routers.bms-api.tls.certresolver=letsencryptresolver
        # priority > bms-ui (10) e < bms-events (30) — pega tudo /api/* antes
        # do catch-all do frontend.
        - traefik.http.routers.bms-api.priority=20
        - traefik.http.routers.bms-api.middlewares=bms-api-strip
        # NestJS não usa prefixo /api nas rotas — strip antes de mandar.
        - traefik.http.middlewares.bms-api-strip.stripprefix.prefixes=/api
        - traefik.http.services.bms-api.loadbalancer.server.port=5001

  frontend-react:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-frontend-react:${IMAGE_TAG:?must set IMAGE_TAG}
    # Só `network_public` — não precisa mais resolver `msgops-api` internamente.
    # Traefik faz o proxy direto pra /api/*. nginx do container só serve estáticos
    # e o location /api/ vira código morto (não chega request lá).
    networks: [network_public]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        # Catch-all do host — pega tudo que não casar com bms-api (priority 20)
        # nem bms-events (priority 30). SPA + estáticos.
        - traefik.http.routers.bms-ui.rule=Host(`${FRONTEND_HOST}`)
        - traefik.http.routers.bms-ui.entrypoints=websecure
        - traefik.http.routers.bms-ui.tls.certresolver=letsencryptresolver
        - traefik.http.routers.bms-ui.priority=10
        - traefik.http.services.bms-ui.loadbalancer.server.port=80

  event-receiver:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-event-receiver:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3011'
    networks: [internal, network_public]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.bms-events.rule=Host(`${FRONTEND_HOST}`) && PathPrefix(`/bms/events`)
        - traefik.http.routers.bms-events.entrypoints=websecure
        - traefik.http.routers.bms-events.tls.certresolver=letsencryptresolver
        - traefik.http.routers.bms-events.priority=30
        - traefik.http.services.bms-events.loadbalancer.server.port=3011

  event-process:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-event-process:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      # main.ts exige BRIDGE_ENDPOINT explícito quando NODE_ENV=production.
      BRIDGE_ENDPOINT: http://localhost:3000
      GEOIP_SERVICE_URL: geolocation:50051
      GEO_GRPC_URL: geolocation:50051
      GEO_ENRICHMENT_ENABLED: 'true'
      GEO_PROVIDER: local
      # event-process uses a separate `pg` Pool driven by DATABASE_* envs
      # (db.provider.ts). Without these the SendgridService.processSendgrid
      # path hits ECONNREFUSED and webhooks pile up in the DLQ.
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_DATABASE: msgops
      DATABASE_LOGS_HOST: postgres
      DATABASE_LOGS_PORT: '5432'
      DATABASE_LOGS_USERNAME: postgres
      DATABASE_LOGS_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      DATABASE_LOGS_DATABASE: msgops
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 768M

  send-email:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-send-email:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  send-push:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-send-push:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
      BMS_CONFIG_DIR: /data/config
    volumes:
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  send-whatsapp:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-send-whatsapp:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  twilio-messaging:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-twilio-messaging:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  campaign-events-tracker:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-campaign-events-tracker:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 384M

  # Worker que consome jobs enfileirados por msgops-api em POST /accounts/import.
  # Sem ele, jobs ficam status=pending pra sempre (enterprise_import_jobs table).
  # Usa BullMQ no Redis pra coordenar — não precisa de port exposto pro Traefik.
  # Precisa das mesmas envs do msgops-api (ENTERPRISE_IMPORT_ENCRYPTION_KEY
  # pra decifrar a API key do Enterprise no banco).
  enterprise-import:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-enterprise-import:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3001'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  campaign-packer:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-campaign-packer:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  tracker:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-tracker:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  tag-process:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-tag-process:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      # main.ts exige BRIDGE_ENDPOINT explícito quando NODE_ENV=production.
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  message-trigger:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-message-trigger:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '3000'
      BRIDGE_ENDPOINT: http://localhost:3000
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

  geolocation:
    image: ${IMAGE_REGISTRY:-etusdigital}/bms-geolocation:${IMAGE_TAG:?must set IMAGE_TAG}
    environment:
      <<: *backend-env
      PORT: '50051'
      GEO_MMDB_DIR: /data/geo
      BMS_CONFIG_DIR: /data/config
    volumes:
      # Volume nomeado em vez de bind mount — evita crash loop quando o path
      # /opt/bms-staging/data/geo não existe no host. Pra popular o mmdb:
      #   docker cp dbip-city-lite.mmdb $(docker ps -q -f name=geolocation):/data/geo/
      # ou via init container num próximo iteration.
      - geo-data:/data/geo
      - bms-config:/data/config:ro
    networks: [internal]
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clickhouse-data:
  ch-ui-data:
  bms-config:
  geo-data:

networks:
  # Overlay attachable EXTERNA — onde o Traefik vive. Setar TRAEFIK_NETWORK_NAME
  # pro nome real da rede (ex.: bmsNet, traefik_public). A rede precisa existir
  # ANTES do stack subir — geralmente criada junto do Traefik via
  # `docker network create --driver overlay --attachable <nome>`.
  network_public:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-bmsNet}
  # Rede interna do stack — apps + infra falam aqui. Criada pelo Swarm na hora.
  internal:
    driver: overlay
    attachable: false

configs:
  clickhouse-init-01:
    external: true
  clickhouse-init-02-auth:
    external: true
  clickhouse-users-experimental:
    external: true
